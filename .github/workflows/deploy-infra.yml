name: deploy-infra
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/deploy-infra.yml"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: >
          az deployment group what-if -g rg-photo-notes-iac -f infra/main.bicep
          -p suffix=${{ vars.PHOTO_SUFFIX }} --result-format ResourceIdOnly
      - name: Deploy
        run: >
          az deployment group create -g rg-photo-notes-iac -n gh-${{ github.run_number }}
          -f infra/main.bicep -p suffix=${{ vars.PHOTO_SUFFIX }}
          --query properties.provisioningState -o tsv
