#cloud-config
package_update: true
packages:
  - python3-flask
  - gunicorn
users:
  - default
  - name: photo-notes
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/photo-notes.service
    content: |
      [Unit]
      Description=Photo Notes web app
      After=network-online.target
      [Service]
      User=photo-notes
      WorkingDirectory=/opt/photo-notes
      ExecStart=/usr/bin/gunicorn --bind 0.0.0.0:80 --workers 2 app:app
      Restart=on-failure
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      [Install]
      WantedBy=multi-user.target
runcmd:
  - mkdir -p /opt/photo-notes
  - chown photo-notes:photo-notes /opt/photo-notes
  - systemctl daemon-reload
  - systemctl enable photo-notes
